name: Build and deploy Zayaan’s Signature

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "zayaans-signature-pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Build GitHub Pages bundle
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy-frontend:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Apply commerce database migrations
        run: |
          for migration in cloudflare/migrations/*.sql; do
            echo "Applying $migration"
            # A migration that already ran reports an existing-column/table error and is
            # skipped rather than failing the deploy -- these files are additive and safe
            # to attempt on every push.
            npx --yes wrangler@4 d1 execute zayaans-signature-commerce --remote --file="$migration" --config cloudflare/wrangler.toml \
              || echo "$migration reported an issue (likely already applied) -- continuing."
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_API }}
      - name: Deploy Cloudflare Worker
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_API }}
      - name: Configure private administrator credentials when provided
        run: |
          if [ -z "$ZAYAAN_ADMIN_PASSWORD" ] || [ -z "$ZAYAAN_ADMIN_USERNAME" ]; then
            echo "Administrator credentials not configured; public catalogue remains available and /admin will stay locked."
            exit 0
          fi
          printf '%s' "$ZAYAAN_ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD --config cloudflare/wrangler.toml
          printf '%s' "$ZAYAAN_ADMIN_USERNAME" | npx --yes wrangler@4 secret put ADMIN_USERNAME --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_API }}
          ZAYAAN_ADMIN_PASSWORD: ${{ secrets.ZAYAAN_ADMIN_PASSWORD }}
          ZAYAAN_ADMIN_USERNAME: ${{ secrets.ZAYAAN_ADMIN_USERNAME }}
      - name: Refresh Steadfast Courier Worker secrets when provided
        run: |
          if [ -z "$STEADFAST_API_KEY" ] || [ -z "$STEADFAST_SECRET_KEY" ]; then
            echo "Steadfast repository secrets are not configured. Existing Cloudflare Worker secrets are retained."
            exit 0
          fi
          printf '%s' "$STEADFAST_API_KEY" | npx --yes wrangler@4 secret put STEADFAST_API_KEY --config cloudflare/wrangler.toml
          printf '%s' "$STEADFAST_SECRET_KEY" | npx --yes wrangler@4 secret put STEADFAST_SECRET_KEY --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_API }}
          STEADFAST_API_KEY: ${{ secrets.STEADFAST_API_KEY }}
          STEADFAST_SECRET_KEY: ${{ secrets.STEADFAST_SECRET_KEY }}
