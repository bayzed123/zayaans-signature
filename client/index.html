<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta
      name="description"
      content="Zayaan’s Signature — premium fashion, crafted with intention."
    />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <title>Zayaan’s Signature | Premium Fashion</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var query = new URLSearchParams(window.location.search);
        var route = query.get("route");
        if (!route || route.charAt(0) !== "/") return;
        var base = "%BASE_URL%".replace(/\/$/, "");
        window.history.replaceState(null, "", base + route);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
